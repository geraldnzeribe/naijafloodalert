name: Daily data, model and website

on:
  schedule:
    - cron: "17 3 * * *"    # 04:17 WAT
    - cron: "17 11 * * *"   # 12:17 WAT
    - cron: "17 19 * * *"   # 20:17 WAT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the pipeline (fetch data, back-fill history, train, score)
        # Progress is saved as it goes, so even a partial run is committed and deployed.
        continue-on-error: true
        run: python -m pipeline.run

      - name: Build low-data pages (text-only LGA pages + USSD data)
        continue-on-error: true
        run: node tools/build_lite.js

      - name: Save new data to the repository
        run: |
          git config user.name "naijafloodalert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline/cache site/data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: automatic update $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase --strategy-option=theirs origin main && git push && break || sleep 10; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
